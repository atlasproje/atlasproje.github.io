<!doctype html>
<!--
  Atlas Proje — 38 saniyelik tanıtım filmi (1920×1080).

  Tek bir çizgiyle başlayan kısa bir film: küçük mühendis "Atlas", pergelle
  çizilen yıldızı omuzlarına alır; binanın tesisatını çalıştırır, suyu veriye,
  veriyi tahmine dönüştürür; dürbününden yapay zekaya bakar, ekibine ders verir
  ve sonunda yıldızı logoya taşır.

  Önizleme:  node render-video.mjs --serve   → yazdığı adresi tarayıcıda aç
             (Boşluk: durdur/oynat · ← →: 1 sn geri/ileri · 0: başa dön)
  Video:     node render-video.mjs           → atlas-tanitim.mp4

  Metinler COPY nesnesinde. Bütün zamanlar filmin başından itibaren saniye.
  Dört "dünya" var (W1 giriş+MEP+veri, W2 yapay zeka, W3 eğitim, W4 kapanış);
  her birinin kendi kamerası var, aralarındaki geçişler render() içinde.
-->
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Atlas Proje — Tanıtım Filmi</title>
<link rel="stylesheet" href="fonts/fonts.css" />
<style>
  :root {
    --navy: #233e65;
    --gold: #b58c4f;
    --gold-light: #d6b684;
    --oxblood: #912930;
    --sand: #ddd1bc;
    --paper: #fbf9f5;
    --ink: #1b2537;
    --ink-soft: #4d566a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #1b2537; overflow: hidden; }
  #stage {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: var(--paper);
    transform-origin: 0 0;
    font-family: 'Instrument Sans', system-ui, sans-serif;
    color: var(--ink);
  }
  .layer { position: absolute; inset: 0; }
  .world { position: absolute; inset: 0; }
  .world > svg { position: absolute; left: 0; top: 0; overflow: hidden; }

  /* paper: soft blotches (move with the camera) + fine grain (the film's) */
  #blotch, #grain { position: absolute; inset: -40px; pointer-events: none; mix-blend-mode: multiply; }
  #blotch {
    opacity: 0.3;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='900' height='900'><filter id='b'><feTurbulence type='fractalNoise' baseFrequency='.004 .006' numOctaves='3' seed='11' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .87  0 0 0 0 .82  0 0 0 0 .72  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23b)'/></svg>");
  }
  #grain {
    opacity: 0.34;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .14  0 0 0 0 .2  0 0 0 0 .3  0 0 0 .42 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  #vignette { position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 280px rgba(35, 62, 101, 0.08); }

  .eyebrow {
    position: absolute;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 500;
    font-size: 21px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-soft);
    white-space: nowrap;
  }
  .eyebrow b { color: var(--gold); font-weight: 500; }
  .eyebrow i { display: inline-block; width: 56px; height: 1px; margin: 0 18px; vertical-align: middle; background: rgba(35, 62, 101, 0.35); }

  .display {
    position: absolute;
    margin: 0;
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 380;
    font-size: 112px;
    line-height: 1.02;
    letter-spacing: -0.025em;
    color: var(--navy);
    font-variation-settings: 'SOFT' 60, 'WONK' 0;
    --u: 0;
  }
  .display em {
    font-style: italic;
    font-weight: 340;
    color: var(--gold);
    font-variation-settings: 'SOFT' 100, 'WONK' 1;
    padding-bottom: 0.05em;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 14' preserveAspectRatio='none'><path d='M3 9.5C38 4.5 76 11 118 6.8S182 4.6 197 8.2' fill='none' stroke='%23912930' stroke-width='2.6' stroke-linecap='round'/></svg>");
    background-repeat: no-repeat;
    background-position: 0 100%;
    background-size: calc(var(--u) * 100%) 0.15em;
  }
  /* one masked line of a headline */
  .line { display: block; overflow: hidden; padding-bottom: 0.12em; margin-bottom: -0.12em; }
  .line > span { display: inline-block; will-change: transform; }

  .sub {
    position: absolute;
    margin: 0;
    width: 660px;
    font-size: 33px;
    line-height: 1.45;
    color: var(--ink-soft);
  }
  /* headline blocks laid out in flow, floating over the drawing */
  .hl { position: absolute; }
  .hl .eyebrow, .hl .display, .hl .sub { position: static; }
  .hl .eyebrow { margin-bottom: 26px; }
  .hl .sub { margin-top: 30px; }
  .hl .display, .hl .sub { text-shadow: 0 0 22px var(--paper), 0 0 22px var(--paper), 0 0 44px var(--paper); }
  .note { font-family: 'Fraunces', serif; font-style: italic; }
  .mono { font-family: 'IBM Plex Mono', monospace; }
  .serif { font-family: 'Fraunces', serif; }
</style>
</head>
<body>
<div id="stage">
  <div id="blotch"></div>
  <div id="worlds" class="layer"></div>
  <svg id="fx" class="layer" viewBox="0 0 1920 1080"></svg>
  <div id="type" class="layer"></div>
  <svg id="chrome" class="layer" viewBox="0 0 1920 1080"></svg>
  <div id="grain"></div>
  <div id="vignette"></div>
</div>

<!-- hand-drawn wobble; the seed changes 8× a second so lines "boil" like pencil animation.
     #boil works in screen pixels (each world applies it outside its camera), so the wobble
     stays the same size however far the camera zooms. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="boil" filterUnits="userSpaceOnUse" x="-40" y="-40" width="2000" height="1160">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="1" result="n" />
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.4" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    <filter id="boil-strong" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="3" seed="1" result="n" />
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4.5" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    <filter id="mblur" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur id="mblur-k" stdDeviation="0 0" />
    </filter>
  </defs>
</svg>

<script>
// ============================================================== copy (TR) ==
const COPY = {
  intro: {
    eyebrow: '<b>N° 00</b><i></i>Adana · Kur. 2006<i></i>37°00′N 35°19′E',
    title: ['Mühendislik', 'yenilikle', '<em>buluşuyor.</em>'],
  },
  mep: {
    eyebrow: '<b>N° 01</b><i></i>Mekanik & MEP',
    title: ['Mekanik & MEP', '<em>mühendisliği</em>'],
    sub: 'HVAC, yangın ve sıhhi tesisat tasarımı. 2006’dan beri sahada.',
    valve: 'vana',
  },
  data: {
    eyebrow: '<b>N° 02</b><i></i>Veri Bilimi',
    title: ['Veri bilimi &', '<em>makine öğrenmesi</em>'],
    sub: 'Ham veriyi tahmine, tahmini karara dönüştürüyoruz.',
    note: 'tahmin',
  },
  ai: {
    eyebrow: '<b>N° 03</b><i></i>Yapay Zeka',
    title: ['Yapay zeka &', '<em>LLM ajanları</em>'],
    sub: 'Şirket verinizle konuşan, işi otomatikleştiren özel ajanlar.',
  },
  training: {
    eyebrow: '<b>N° 04</b><i></i>Kurumsal Eğitim',
    title: ['Dijital dönüşüm', '& <em>eğitimler</em>'],
    sub: 'Ekipler için veri okuryazarlığı, yapay zeka ve otomasyon eğitimleri.',
    stamp: 'YAKINDA',
  },
  bridge: {
    eyebrow: '<b>N° 05</b><i></i>Farkımız',
    title: ['Fiziksel güven, dijital <em>zeka.</em>'],
    sub: 'Mühendislik ve yazılım, aynı masada.',
  },
  outro: {
    name: 'Atlas <em>Proje</em>',
    tagline: 'Mühendislik & Teknoloji · Adana',
    url: 'atlasproje.github.io',
    seal: 'ATLAS PROJE · MÜHENDİSLİK & TEKNOLOJİ · ADANA · ',
  },
};

// ================================================================ helpers ==
const DURATION = 38;
const NS = 'http://www.w3.org/2000/svg';
const NAVY = '#233e65', NAVY2 = '#5a6d8e', GOLD = '#b58c4f', OX = '#912930', PAPER = '#fbf9f5';
const E = {
  lin: (x) => x,
  io: (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2),
  out: (x) => 1 - Math.pow(1 - x, 4),
  back: (x) => 1 + 2.4 * Math.pow(x - 1, 3) + 1.4 * Math.pow(x - 1, 2),
  inQ: (x) => x * x,
  in3: (x) => x * x * x,
  // accelerate for a, cruise, brake for a: how a walk starts and stops
  trap: (u, a = 0.2) => {
    const v = 1 / (1 - a);
    if (u < a) return (v * u * u) / (2 * a);
    if (u > 1 - a) return 1 - (v * (1 - u) * (1 - u)) / (2 * a);
    return v * (u - a / 2);
  },
};
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const P = (t, a, b, e = E.lin) => (b <= a ? (t >= a ? 1 : 0) : e(clamp((t - a) / (b - a))));
const lerp = (a, b, k) => a + (b - a) * k;
const lerp2 = (p, q, k) => [lerp(p[0], q[0], k), lerp(p[1], q[1], k)];
const rad = (d) => (d * Math.PI) / 180;
const deg = (r) => (r * 180) / Math.PI;

function svg(tag, attrs = {}, parent) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') e.textContent = v;
    else e.setAttribute(k, v);
  }
  if (parent) parent.appendChild(e);
  return e;
}
function html(tag, cls, parent, inner) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (inner != null) e.innerHTML = inner;
  if (parent) parent.appendChild(e);
  return e;
}
const f1 = (v) => v.toFixed(1);
const pathOf = (list, close = false) => 'M' + list.map((p) => `${f1(p[0])} ${f1(p[1])}`).join(' L') + (close ? ' Z' : '');
const circlePath = (cx, cy, r) => `M${f1(cx - r)} ${f1(cy)} a${f1(r)} ${f1(r)} 0 1 0 ${f1(2 * r)} 0 a${f1(r)} ${f1(r)} 0 1 0 ${f1(-2 * r)} 0`;
// deterministic "random"
const rnd = (i) => { const x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); };
// stroke presets
const ink = (w = 2, color = NAVY, extra = {}) => ({ fill: 'none', stroke: color, 'stroke-width': w, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', ...extra });

function starPath(cx, cy, inner, outer, points = 8) {
  const list = [];
  for (let i = 0; i < points * 2; i++) {
    const r = i % 2 ? inner : outer;
    const a = (Math.PI / points) * i - Math.PI / 2;
    list.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]);
  }
  return pathOf(list, true);
}
// eight-point star made of two squares (the Atlas mark)
function atlasStar(cx, cy, R) {
  const inner = (R * Math.cos(Math.PI / 4)) / Math.cos(Math.PI / 8);
  const list = [];
  for (let i = 0; i < 16; i++) {
    const r = i % 2 ? inner : R;
    const a = (i * 22.5 * Math.PI) / 180;
    list.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]);
  }
  return pathOf(list, true);
}
const arcPath = (cx, cy, r, from, to) => {
  const p = (d) => [cx + r * Math.cos((d * Math.PI) / 180), cy + r * Math.sin((d * Math.PI) / 180)];
  const [x1, y1] = p(from), [x2, y2] = p(to);
  const large = Math.abs(to - from) > 180 ? 1 : 0;
  return `M${f1(x1)} ${f1(y1)} A${r} ${r} 0 ${large} 1 ${f1(x2)} ${f1(y2)}`;
};
const norm = (v) => { const l = Math.hypot(v[0], v[1]) || 1; return [v[0] / l, v[1] / l]; };
const perp = (v) => [-v[1], v[0]];

// ================================================================ timeline ==
// Everything animated registers here, with absolute film times.
const items = [];
function on(el, kind, a, b, opt = {}) {
  const it = { el, kind, a, b, c: opt.out ? opt.out[0] : Infinity, d: opt.out ? opt.out[1] : Infinity, ...opt };
  if (kind === 'draw') {
    if (!el.hasAttribute('pathLength')) el.setAttribute('pathLength', '1');
    el.style.strokeDasharray = '1 1';
  }
  if (kind === 'drawText') el.style.strokeDasharray = `${opt.len} ${opt.len}`;
  if ((kind === 'pop' || kind === 'stamp') && el instanceof SVGElement) { el.style.transformBox = 'fill-box'; el.style.transformOrigin = 'center'; }
  items.push(it);
  return el;
}
const every = (fn) => items.push({ kind: 'fn', fn });
let jolt = [0, 0];

// ================================================================= worlds ==
// A world is a drawing with its own camera. Its lines boil in screen space;
// `flat` holds labels and stamps that should stay crisp.
const worlds = [];
function world(name, a, b, keys, shake = 1) {
  const div = html('div', 'world', document.getElementById('worlds'));
  const s = svg('svg', { width: 1920, height: 1080, viewBox: '0 0 1920 1080' }, div);
  const boiled = svg('g', { filter: 'url(#boil)' }, s);
  const cam = svg('g', {}, boiled);
  const flat = svg('g', {}, s);
  const W = { name, a, b, div, svg: s, cam, flat, shake, c: { x: 0, y: 0, z: 1, r: 0 } };
  W.setKeys = (k) => { W.keys = k.map(([t, x, y, z, r = 0, hold = 0]) => [t, x, y, Math.log(z), r, hold]); };
  W.setKeys(keys);
  worlds.push(W);
  return W;
}
// Catmull-Rom through the camera keys (zoom in log space), so the camera
// never stops dead between shots unless a key says hold.
function spline(K, t, j) {
  const n = K.length;
  if (t <= K[0][0]) return K[0][j];
  if (t >= K[n - 1][0]) return K[n - 1][j];
  let i = 0;
  while (K[i + 1][0] <= t) i++;
  const a = K[i], b = K[i + 1], h = b[0] - a[0], u = (t - a[0]) / h;
  const tan = (k) => (k === 0 || k === n - 1 || K[k][5] ? 0 : (K[k + 1][j] - K[k - 1][j]) / (K[k + 1][0] - K[k - 1][0]));
  const m0 = tan(i) * h, m1 = tan(i + 1) * h, u2 = u * u, u3 = u2 * u;
  return (2 * u3 - 3 * u2 + 1) * a[j] + (u3 - 2 * u2 + u) * m0 + (-2 * u3 + 3 * u2) * b[j] + (u3 - u2) * m1;
}
function camAt(W, t) {
  const z = Math.exp(spline(W.keys, t, 3));
  const sh = W.shake;
  // a hand on the camera: a few pixels of slow drift, never still
  const hx = (Math.sin(t * 0.83) * 3.2 + Math.sin(t * 2.1 + 1) * 1.4) * sh;
  const hy = (Math.sin(t * 0.97 + 2) * 3 + Math.sin(t * 1.9) * 1.2) * sh;
  return { x: spline(W.keys, t, 1) + hx / z, y: spline(W.keys, t, 2) + hy / z, z, r: spline(W.keys, t, 4) + Math.sin(t * 0.61) * 0.14 * sh };
}
function toScreen(W, p) {
  const c = W.c, dx = (p[0] - c.x) * c.z, dy = (p[1] - c.y) * c.z, r = rad(c.r);
  return [960 + dx * Math.cos(r) - dy * Math.sin(r), 540 + dx * Math.sin(r) + dy * Math.cos(r)];
}

// ================================================================ figures ==
// Atlas and friends: a small rig (hips, knees, shoulders, elbows, head) drawn
// as ink lines every frame. Walking and running come from how far the figure
// has travelled, so feet never slide; poses blend; hands can hold things (IK).
const HZ = 240, T_MIN = -1;
const STAND = { N: [8, 16], F: [-6, 16], legs: { N: [3, 5], F: [-3, 5] }, lean: 0, tilt: 0, look: 0, swing: 1, smile: 0.5 };
const UA = 44, FA = 42, TH = 50, SH = 50; // upper arm, forearm, thigh, shin

function gait(ph, run) {
  const aH = lerp(24, 40, run), aK = lerp(44, 92, run), aA = lerp(20, 36, run);
  const sp = Math.sin(ph), cp = Math.cos(ph);
  const knee = (c) => 5 + aK * Math.pow(Math.max(0, c), 1.3);
  return {
    legs: { N: [aH * sp, knee(cp)], F: [-aH * sp, knee(-cp)] },
    N: [-aA * sp + 6, lerp(20, 88, run)],
    F: [aA * sp + 6, lerp(20, 88, run)],
    lean: lerp(5, 15, run),
    lift: run * 12 * sp * sp,
  };
}
// two-bone IK in the figure's facing frame; angles: 0 = down, 90 = forward, 180 = up
function ik(S, T, a, b, dir, bend = 1) {
  const dx = (T[0] - S[0]) * dir, dy = T[1] - S[1];
  const d = clamp(Math.hypot(dx, dy), Math.abs(a - b) + 0.01, a + b - 0.01);
  const th = Math.atan2(dx, dy);
  const al = Math.acos(clamp((a * a + d * d - b * b) / (2 * a * d), -1, 1));
  const be = Math.acos(clamp((a * a + b * b - d * d) / (2 * a * b), -1, 1));
  return [deg(th - bend * al), deg(bend * (Math.PI - be))];
}

const figures = [];
function figure(W, o = {}) {
  const s = o.scale ?? 1;
  const F = {
    W, s, hat: o.hat ?? 'helmet', glasses: !!o.glasses, dir0: o.dir ?? 1,
    ground: o.ground ?? (() => 0),
    moves: [], dirKeys: [], poses: [{ t: -99, p: {}, d: 0.01 }], jumps: [], hits: [], props: [],
    reveal: o.reveal ?? null, show: o.show ?? [-99, 999], seed: o.seed ?? 1,
  };
  figures.push(F);
  const root = svg('g', {}, o.parent ?? W.cam);
  F.root = root;
  const L = (w, c = NAVY, extra = {}) => { const p = svg('path', { ...ink(w * s, c), ...extra }, root); p.setAttribute('pathLength', 1); return p; };
  const part = {};
  part.armF = L(4.4, NAVY2);
  part.handF = svg('circle', { r: 4.6 * s, fill: NAVY2 }, root);
  part.legF = L(5, NAVY2);
  part.footF = L(8, NAVY2);
  part.legN = L(5);
  part.footN = L(8);
  part.torso = L(2.6, NAVY, { fill: NAVY });
  part.scarf = L(6.5, OX);
  part.knot = svg('circle', { r: 4.4 * s, fill: OX }, root);
  part.head = L(2.8, NAVY, { fill: PAPER });
  part.cheek = svg('circle', { r: 3.8 * s, fill: 'rgba(145,41,48,.26)' }, root);
  part.eyes = svg('path', { fill: NAVY, stroke: NAVY, 'stroke-width': 1.7 * s, 'stroke-linecap': 'round' }, root);
  part.mouth = L(1.7);
  part.glasses = F.glasses ? L(1.8) : null;
  part.hat = L(2.4, NAVY, { fill: F.hat === 'helmet' ? GOLD : F.hat === 'cap' ? OX : NAVY });
  part.bun = F.hat === 'bun' ? svg('path', { fill: NAVY }, root) : null;
  part.armN = L(4.8);
  part.handN = svg('circle', { r: 4.9 * s, fill: NAVY }, root);
  // props
  part.spy = svg('g', {}, root);
  part.spyA = svg('path', { ...ink(12 * s), 'stroke-linecap': 'butt' }, part.spy);
  part.spyB = svg('path', { ...ink(9.5 * s), 'stroke-linecap': 'butt' }, part.spy);
  part.spyC = svg('path', { ...ink(7 * s, GOLD), 'stroke-linecap': 'butt' }, part.spy);
  part.spyL = svg('path', { ...ink(2.2 * s), fill: PAPER }, part.spy);
  part.pointer = L(3, NAVY);
  part.pointerTip = svg('circle', { r: 4 * s, fill: GOLD }, root);
  part.paper = svg('path', { ...ink(2 * s), fill: PAPER }, root);
  const strokes = [part.armF, part.legF, part.footF, part.legN, part.footN, part.torso, part.scarf, part.head, part.mouth, part.hat, part.armN, part.glasses].filter(Boolean);

  F.xAt = (t) => {
    const M = F.moves;
    if (!M.length) return 0;
    if (t <= M[0].t) return M[0].x;
    for (let i = 0; i < M.length - 1; i++) {
      const a = M[i], b = M[i + 1];
      if (t < b.t) return a.x + (b.x - a.x) * E.trap(clamp((t - a.t) / (b.t - a.t)), b.acc ?? 0.2);
    }
    return M[M.length - 1].x;
  };
  F.bake = () => {
    const n = Math.ceil((DURATION + 2 - T_MIN) * HZ) + 1;
    F.n = n;
    F.spd = new Float32Array(n); F.ph = new Float32Array(n); F.dirs = new Int8Array(n); F.vx = new Float32Array(n);
    const xs = new Float32Array(n);
    for (let i = 0; i < n; i++) xs[i] = F.xAt(T_MIN + i / HZ);
    const DK = [...F.dirKeys].sort((a, b) => a.t - b.t);
    let ph = 0, d = F.dir0, k = 0;
    for (let i = 0; i < n; i++) {
      const t = T_MIN + i / HZ;
      const i0 = Math.max(0, i - 12), i1 = Math.min(n - 1, i + 12);
      const v = (xs[i1] - xs[i0]) / ((i1 - i0) / HZ);
      F.vx[i] = v;
      F.spd[i] = Math.abs(v) / s;
      if (i > 0) {
        const dx = xs[i] - xs[i - 1], dy = F.ground(xs[i]) - F.ground(xs[i - 1]);
        const run = clamp((F.spd[i] - 300) / 250);
        ph += (Math.PI * Math.hypot(dx, dy)) / s / lerp(92, 176, run);
      }
      F.ph[i] = ph;
      while (k < DK.length && DK[k].t <= t) { d = DK[k].dir; k++; }
      if (Math.abs(v) > 25) d = Math.sign(v);
      F.dirs[i] = d;
    }
  };
  const idx = (t) => clamp(Math.round((t - T_MIN) * HZ), 0, F.n - 1);
  const poseAt = (t) => {
    const K = F.poses;
    let i = 0;
    while (i + 1 < K.length && K[i + 1].t <= t) i++;
    const cur = K[i], prev = K[Math.max(0, i - 1)];
    const k = i === 0 ? 1 : P(t, cur.t, cur.t + (cur.d ?? 0.3), E.io);
    const res = (p) => ({ ...STAND, ...(typeof p === 'function' ? p(t) : p) });
    return [res(prev.p), res(cur.p), k];
  };
  const jumpAt = (t) => {
    let y = 0, st = 0;
    for (const j of F.jumps) if (t > j.a && t < j.b) { const u = (t - j.a) / (j.b - j.a); y += j.h * Math.sin(Math.PI * u); st += 0.1 * Math.sin(Math.PI * u); }
    return [y, st];
  };
  const squashAt = (t) => {
    let sq = 0;
    const hits = [...F.hits, ...F.jumps.flatMap((j) => [{ t: j.a - 0.07, a: 0.13 }, { t: j.b, a: 0.2 }])];
    for (const h of hits) { const tau = t - h.t; if (tau >= 0 && tau < 1) sq += h.a * Math.exp(-6.5 * tau) * Math.sin(22 * tau); }
    return sq;
  };
  const blinking = (t) => {
    const n0 = Math.floor(t / 2.9);
    for (let n = n0 - 1; n <= n0 + 1; n++) {
      const tb = 0.6 + n * 2.9 + rnd(F.seed * 31 + n) * 1.3;
      if (t >= tb && t < tb + 0.13) return true;
    }
    return false;
  };
  F.eval = (t) => {
    if (!F.spd) F.bake();
    if (F._t === t) return F._J;
    const i = idx(t), x = F.xAt(t), dir = F.dirs[i], spd = F.spd[i];
    const w = clamp(spd / 110), run = clamp((spd - 300) / 250);
    const G = gait(F.ph[i], run);
    const [A, B, k] = poseAt(t);
    const mix = (key) => lerp(A[key], B[key], k);
    const legs = {};
    for (const side of ['N', 'F']) {
      const pl = [lerp(A.legs[side][0], B.legs[side][0], k), lerp(A.legs[side][1], B.legs[side][1], k)];
      legs[side] = [lerp(pl[0], G.legs[side][0], w), lerp(pl[1], G.legs[side][1], w)];
    }
    const slope = (F.ground(x + 10) - F.ground(x - 10)) / 20;
    let lean = lerp(mix('lean'), G.lean, w) + deg(Math.atan(Math.max(0, -slope * dir))) * 0.4 * w;
    const off = (h, kn) => [Math.sin(rad(h)) * TH * s + Math.sin(rad(h - kn)) * SH * s, Math.cos(rad(h)) * TH * s + Math.cos(rad(h - kn)) * SH * s];
    const oN = off(...legs.N), oF = off(...legs.F);
    const [jy, jst] = jumpAt(t);
    let hipY = Math.min(F.ground(x + dir * oN[0]) - oN[1], F.ground(x + dir * oF[0]) - oF[1]) - 7 * s;
    hipY -= (w * G.lift + jy) * s;
    const hip = [x, hipY];
    const th = rad(dir * lean), ct = Math.cos(th), st = Math.sin(th);
    const tp = (lx, ly) => [hip[0] + (dir * lx * ct - ly * st) * s, hip[1] + (dir * lx * st + ly * ct) * s];
    const tilt = mix('tilt'), look = mix('look');
    const neck = tp(0, -64);
    const ha = rad(dir * (lean + tilt)), hc = Math.cos(ha), hs = Math.sin(ha);
    const headC = [neck[0] - -23 * hs * s, neck[1] + -23 * hc * s];
    const hp = (lx, ly) => [headC[0] + (dir * lx * hc - ly * hs) * s, headC[1] + (dir * lx * hs + ly * hc) * s];
    const J = { t, x, dir, s, hip, neck, headC, hp, tp, lean, look, smile: mix('smile'), ground: F.ground(x), sq: squashAt(t) - jst };
    J.shN = tp(2, -55); J.shF = tp(-3, -56);
    const armAngles = (pose, side) => {
      const tgt = pose[side + 'T'];
      if (tgt) return ik(side === 'N' ? J.shN : J.shF, typeof tgt === 'function' ? tgt(J) : tgt, UA * s, FA * s, dir, pose.bend ?? 1);
      return [pose[side][0] + lean * 0.7, pose[side][1]];
    };
    const swing = mix('swing') * w;
    for (const side of ['N', 'F']) {
      const a0 = armAngles(A, side), a1 = armAngles(B, side);
      let sh = lerp(a0[0], a1[0], k), el = lerp(a0[1], a1[1], k);
      sh = lerp(sh, G[side][0] + lean * 0.6, swing);
      el = lerp(el, G[side][1], swing);
      const S0 = side === 'N' ? J.shN : J.shF;
      const e = [S0[0] + dir * Math.sin(rad(sh)) * UA * s, S0[1] + Math.cos(rad(sh)) * UA * s];
      const h = [e[0] + dir * Math.sin(rad(sh + el)) * FA * s, e[1] + Math.cos(rad(sh + el)) * FA * s];
      J['el' + side] = e; J['ha' + side] = h;
      const [hA, kA] = legs[side];
      const kn = [hip[0] + dir * Math.sin(rad(hA)) * TH * s, hip[1] + Math.cos(rad(hA)) * TH * s];
      const an = [kn[0] + dir * Math.sin(rad(hA - kA)) * SH * s, kn[1] + Math.cos(rad(hA - kA)) * SH * s];
      J['kn' + side] = kn; J['an' + side] = an; J['to' + side] = [an[0] + dir * 13 * s, an[1] + 0.5 * s];
    }
    J.blink = blinking(t) || (F.blinks || []).some((b) => t >= b && t < b + 0.14);
    J.props = F.props.filter((p) => t >= p.a && t < p.b).map((p) => p.name);
    J.lens = hp(70, -10);
    J.speed = spd;
    F._t = t; F._J = J;
    return J;
  };
  F.overhead = (J) => [J.hip[0] + J.dir * 6 * s, J.hip[1] - 168 * s];

  const line = (...p) => 'M' + p.map((q) => `${f1(q[0])} ${f1(q[1])}`).join(' L');
  F.draw = (t) => {
    const vis = t >= F.show[0] && t <= F.show[1];
    root.style.display = vis ? '' : 'none';
    if (!vis) return;
    const J = F.eval(t);
    const { hp, tp, dir } = J;
    part.armF.setAttribute('d', line(J.shF, J.elF, J.haF));
    part.handF.setAttribute('cx', f1(J.haF[0])); part.handF.setAttribute('cy', f1(J.haF[1]));
    part.legF.setAttribute('d', line(J.hip, J.knF, J.anF));
    part.footF.setAttribute('d', line(J.anF, J.toF));
    part.legN.setAttribute('d', line(J.hip, J.knN, J.anN));
    part.footN.setAttribute('d', line(J.anN, J.toN));
    const q = (a, b) => `${f1(a[0])} ${f1(a[1])} ${f1(b[0])} ${f1(b[1])}`;
    part.torso.setAttribute('d', `M${line(tp(-14, 5), tp(13, 5), tp(14, -50)).slice(1)} Q${q(tp(15, -66), tp(0, -66))} Q${q(tp(-17, -66), tp(-16, -50))} Z`);
    // scarf trails behind, flutters with speed
    const sp = clamp(J.speed / 500);
    const nk = tp(0, -62);
    const flut = Math.sin(t * 17 + F.seed) * (3 + 7 * sp);
    const tail = [nk[0] - dir * (16 + 20 * sp) * J.s, nk[1] + (12 - 6 * sp + flut) * J.s];
    part.scarf.setAttribute('d', `M${f1(nk[0])} ${f1(nk[1])} Q${f1(nk[0] - dir * 10 * J.s)} ${f1(nk[1] + (2 + flut * 0.5) * J.s)} ${f1(tail[0])} ${f1(tail[1])}`);
    part.knot.setAttribute('cx', f1(nk[0])); part.knot.setAttribute('cy', f1(nk[1]));
    part.head.setAttribute('d', circlePath(J.headC[0], J.headC[1], 21 * J.s));
    const ch = hp(12, 7);
    part.cheek.setAttribute('cx', f1(ch[0])); part.cheek.setAttribute('cy', f1(ch[1]));
    const ly = -2 + J.look * 2.5;
    const eye = (lx) => {
      const c = hp(lx, ly);
      if (J.blink) return `M${f1(c[0] - 2.6 * J.s)} ${f1(c[1])} L${f1(c[0] + 2.6 * J.s)} ${f1(c[1])}`;
      return circlePath(c[0], c[1], 2.4 * J.s);
    };
    part.eyes.setAttribute('d', eye(7) + ' ' + eye(15));
    const m0 = hp(9, 9), m1 = hp(17, 7.5), mc = hp(13, 9 + 4 * J.smile);
    part.mouth.setAttribute('d', `M${f1(m0[0])} ${f1(m0[1])} Q${f1(mc[0])} ${f1(mc[1])} ${f1(m1[0])} ${f1(m1[1])}`);
    if (part.glasses) {
      const g1 = hp(7, ly), g2 = hp(15, ly);
      part.glasses.setAttribute('d', circlePath(g1[0], g1[1], 5 * J.s) + ' ' + circlePath(g2[0], g2[1], 5 * J.s) + ' ' + line(hp(-18, -2), hp(2, ly)));
    }
    const hq = (a, b, c) => `C${f1(hp(...a)[0])} ${f1(hp(...a)[1])} ${f1(hp(...b)[0])} ${f1(hp(...b)[1])} ${f1(hp(...c)[0])} ${f1(hp(...c)[1])}`;
    const hm = (a) => `M${f1(hp(...a)[0])} ${f1(hp(...a)[1])}`;
    if (F.hat === 'helmet') part.hat.setAttribute('d', `${hm([-22, -5])} ${hq([-22, -32], [22, -32], [22, -5])} Z ${hm([-25, -5])} L${f1(hp(31, -5)[0])} ${f1(hp(31, -5)[1])}`);
    else if (F.hat === 'cap') part.hat.setAttribute('d', `${hm([-22, -9])} ${hq([-24, -32], [22, -34], [27, -12])} ${hq([10, -7], [-10, -7], [-22, -9])} Z`);
    else part.hat.setAttribute('d', `${hm([-21, -3])} ${hq([-21, -27], [15, -29], [21, -9])} ${hq([9, -16], [-8, -13], [-21, -3])} Z`);
    if (part.bun) { const b = hp(-17, -21); part.bun.setAttribute('d', circlePath(b[0], b[1], 8.5 * J.s)); }
    part.armN.setAttribute('d', line(J.shN, J.elN, J.haN));
    part.handN.setAttribute('cx', f1(J.haN[0])); part.handN.setAttribute('cy', f1(J.haN[1]));
    // props
    const has = (n) => J.props.includes(n);
    part.spy.style.display = has('spyglass') ? '' : 'none';
    if (has('spyglass')) {
      const a = hp(14, -3), b = hp(36, -5), c = hp(56, -8), d = hp(68, -10);
      part.spyA.setAttribute('d', line(a, b)); part.spyB.setAttribute('d', line(b, c)); part.spyC.setAttribute('d', line(c, d));
      part.spyL.setAttribute('d', circlePath(d[0], d[1], 4.2 * J.s));
    }
    part.pointer.style.display = part.pointerTip.style.display = has('pointer') ? '' : 'none';
    if (has('pointer')) {
      const v = norm([J.haN[0] - J.elN[0], J.haN[1] - J.elN[1]]);
      const tip = [J.haN[0] + v[0] * 118 * J.s, J.haN[1] + v[1] * 118 * J.s];
      part.pointer.setAttribute('d', line([J.haN[0] - v[0] * 10, J.haN[1] - v[1] * 10], tip));
      part.pointerTip.setAttribute('cx', f1(tip[0])); part.pointerTip.setAttribute('cy', f1(tip[1]));
    }
    part.paper.style.display = has('paper') ? '' : 'none';
    if (has('paper')) {
      const m = lerp2(J.haN, J.haF, 0.5), c = [m[0], m[1] - 22 * J.s];
      const pts = [[-24, -30], [18, -30], [26, -22], [26, 30], [-24, 30]].map(([u, v]) => [c[0] + u * J.s * dir, c[1] + v * J.s]);
      part.paper.setAttribute('d', pathOf(pts, true) + ' ' + line([c[0] - 14 * dir, c[1] - 12], [c[0] + 14 * dir, c[1] - 12]) + ' ' + line([c[0] - 14 * dir, c[1]], [c[0] + 10 * dir, c[1]]) + ' ' + line([c[0] - 14 * dir, c[1] + 12], [c[0] + 12 * dir, c[1] + 12]));
    }
    // squash & stretch around the feet
    const gy = J.ground, sq = J.sq;
    root.setAttribute('transform', `translate(${f1(J.x)} ${f1(gy)}) scale(${(1 + sq * 0.55).toFixed(4)} ${(1 - sq).toFixed(4)}) translate(${f1(-J.x)} ${f1(-gy)})`);
    // sketched in the first time we see it
    if (F.reveal) {
      const kk = P(t, F.reveal[0], F.reveal[1], E.io);
      for (const p of strokes) { p.style.strokeDasharray = kk < 1 ? '1 1' : 'none'; p.style.strokeDashoffset = 1 - kk; }
      const fo = P(t, lerp(F.reveal[0], F.reveal[1], 0.6), F.reveal[1]);
      for (const p of [part.torso, part.head, part.hat, part.bun, part.handN, part.handF, part.knot, part.eyes, part.cheek]) if (p) p.style.fillOpacity = fo;
    }
  };
  every((t) => { if (t >= W.a && t <= W.b) F.draw(t); });
  return F;
}

// A small gold star that follows Atlas around (his "world"), or rides on his hands.
function companion(W, F, keys) {
  const g = svg('g', {}, W.cam);
  const body = svg('path', { d: atlasStar(0, 0, 22), fill: GOLD, ...ink(2.2, NAVY), fill: GOLD }, g);
  const glints = [];
  for (let k = 0; k < 4; k++) glints.push(svg('path', { ...ink(2, GOLD) }, g));
  const target = (m, t) => {
    if (m.m === 'at') return [m.x, m.y, m.k ?? 1, m.r ?? 0];
    if (m.m === 'overhead') { const J = F.eval(t); const [x, y] = F.overhead(J); return [x, y + Math.sin(t * 5) * 1.5, 1.55 * F.s, 0]; }
    // shoulder: floats behind and above, lags a beat, bobs
    const J = F.eval(Math.max(T_MIN, t - 0.16));
    return [J.neck[0] - J.dir * 48 * F.s, J.neck[1] - 62 * F.s + Math.sin(t * 3.1) * 7, 0.95 * F.s, 0];
  };
  every((t) => {
    if (t < W.a || t > W.b) return;
    let i = -1;
    while (i + 1 < keys.length && keys[i + 1].t <= t) i++;
    if (i < 0 || keys[i].m === 'hidden') { g.style.display = 'none'; return; }
    g.style.display = '';
    const cur = keys[i], prev = keys[Math.max(0, i - 1)];
    const k = i === 0 || prev.m === 'hidden' ? 1 : P(t, cur.t, cur.t + (cur.d ?? 0.5), E.io);
    const a = target(prev, t), b = target(cur, t);
    const x = lerp(a[0], b[0], k), y = lerp(a[1], b[1], k), sc = Math.exp(lerp(Math.log(a[2]), Math.log(b[2]), k));
    const spin = t * 38 + (cur.spin ?? 0) * E.io(k);
    g.setAttribute('transform', `translate(${f1(x)} ${f1(y)}) rotate(${f1(spin + lerp(a[3], b[3], k))}) scale(${sc.toFixed(3)})`);
    body.setAttribute('stroke-width', (2.2 / Math.max(1, sc * 0.6)).toFixed(2));
    glints.forEach((gl, n) => {
      const ph = (t * 1.3 + n * 0.25) % 1, an = rad(n * 90 + 45), r0 = 30 + ph * 14;
      gl.setAttribute('d', `M${f1(Math.cos(an) * r0)} ${f1(Math.sin(an) * r0)} L${f1(Math.cos(an) * (r0 + 7))} ${f1(Math.sin(an) * (r0 + 7))}`);
      gl.setAttribute('opacity', (Math.sin(ph * Math.PI) * 0.9 * (sc < 2 ? 1 : 0)).toFixed(2));
    });
  });
  return g;
}

// ============================================================ drawing tools ==
// A pencil whose lead follows `tip(t)`: slides in, draws, lifts away.
function pencil(W, tip, a, b, c, d) {
  const g = svg('g', {}, W.cam);
  const body = svg('g', {}, g);
  svg('path', { d: 'M0 0 L34 -9 L34 9 Z', ...ink(2), fill: '#f3e7cf' }, body);
  svg('path', { d: 'M0 0 L11 -3 L11 3 Z', fill: NAVY }, body);
  svg('path', { d: 'M34 -9 H236 V9 H34 Z', ...ink(2), fill: GOLD }, body);
  svg('path', { d: 'M34 -3 H236 M34 3 H236', ...ink(1, 'rgba(35,62,101,.35)') }, body);
  svg('path', { d: 'M236 -10 H258 V10 H236 Z', ...ink(2), fill: '#c9cdd3' }, body);
  svg('path', { d: 'M258 -9 H280 Q286 0 280 9 H258 Z', ...ink(2), fill: OX }, body);
  every((t) => {
    if (t < a || t > d) { g.style.display = 'none'; return; }
    g.style.display = '';
    const [x, y] = tip(clamp(t, b, c));
    const kin = 1 - P(t, a, b, E.out), kout = P(t, c, d, E.in3);
    const lift = kin * 260 + kout * 320;
    const ang = -58 + Math.sin(t * 9) * 2 + kin * 10;
    g.setAttribute('transform', `translate(${f1(x + lift * 0.5)} ${f1(y - lift * 0.86)}) rotate(${f1(ang)})`);
    g.setAttribute('opacity', (1 - kout).toFixed(2));
  });
}
// Compass: needle at c, pencil leg sweeps a circle of radius r from `from`° over [a, b].
function compass(W, c, r, a, b, from = -90, opt = {}) {
  const g = W.cam;
  const circ = svg('path', { d: arcPath(c[0], c[1], r, from, from + 180) + ' ' + arcPath(c[0], c[1], r, from + 180, from + 359.9), ...ink(opt.w ?? 1.4, opt.color ?? 'rgba(35,62,101,.6)') }, g);
  on(circ, 'draw', a, b, { out: opt.out });
  const tool = svg('g', {}, g);
  const legs = svg('path', { ...ink(3.4) }, tool);
  const lead = svg('path', { ...ink(3.4, GOLD) }, tool);
  const hinge = svg('circle', { r: 9, ...ink(2.4), fill: PAPER }, tool);
  const handle = svg('path', { ...ink(4, NAVY) }, tool);
  const cc = opt.center ?? (() => c);
  every((t) => {
    const t0 = a - 0.3, t1 = b + 0.35;
    if (t < t0 || t > t1) { tool.style.display = 'none'; return; }
    tool.style.display = '';
    const C = cc(t);
    const th = rad(from + 360 * P(t, a, b, E.io));
    const Lp = [C[0] + r * Math.cos(th), C[1] + r * Math.sin(th)];
    const n = perp(norm([Lp[0] - C[0], Lp[1] - C[1]]));
    const sgn = n[1] > 0 ? -1 : 1;
    const H = [lerp(C[0], Lp[0], 0.5) + n[0] * sgn * r * 0.42, lerp(C[1], Lp[1], 0.5) + n[1] * sgn * r * 0.42];
    const Ln = norm([Lp[0] - H[0], Lp[1] - H[1]]);
    legs.setAttribute('d', `M${f1(C[0])} ${f1(C[1])} L${f1(H[0])} ${f1(H[1])} L${f1(Lp[0] - Ln[0] * 18)} ${f1(Lp[1] - Ln[1] * 18)}`);
    lead.setAttribute('d', `M${f1(Lp[0] - Ln[0] * 18)} ${f1(Lp[1] - Ln[1] * 18)} L${f1(Lp[0])} ${f1(Lp[1])}`);
    hinge.setAttribute('cx', f1(H[0])); hinge.setAttribute('cy', f1(H[1]));
    const hv = norm([H[0] - lerp(C[0], Lp[0], 0.5), H[1] - lerp(C[1], Lp[1], 0.5)]);
    handle.setAttribute('d', `M${f1(H[0] + hv[0] * 9)} ${f1(H[1] + hv[1] * 9)} L${f1(H[0] + hv[0] * 34)} ${f1(H[1] + hv[1] * 34)}`);
    const k = P(t, t0, a, E.out) * (1 - P(t, b, t1, E.inQ));
    tool.setAttribute('opacity', k.toFixed(2));
    tool.setAttribute('transform', `translate(0 ${f1(-(1 - k) * 60)})`);
  });
  return circ;
}
// Pipe: two parallel walls along a polyline (mitred corners).
function pipeWalls(list, w) {
  const n = list.length;
  const off = (k) => list.map((p, i) => {
    const prev = list[Math.max(0, i - 1)], next = list[Math.min(n - 1, i + 1)];
    const d1 = norm([p[0] - prev[0], p[1] - prev[1]]), d2 = norm([next[0] - p[0], next[1] - p[1]]);
    const n1 = i === 0 ? perp(d2) : perp(d1), n2 = i === n - 1 ? perp(d1) : perp(d2);
    const m = norm([n1[0] + n2[0], n1[1] + n2[1]]);
    const len = (k * w) / Math.max(0.3, m[0] * n1[0] + m[1] * n1[1]);
    return [p[0] + m[0] * len, p[1] + m[1] * len];
  });
  return [pathOf(off(1)), pathOf(off(-1))];
}
// Rubber stamp: slams down, settles, the whole frame jolts.
function stampAt(el, a) {
  on(el, 'stamp', a, a + 0.22);
  const t0 = a + 0.2;
  every((t) => {
    const k = clamp((t - t0) / 0.3);
    if (k > 0 && k < 1) { const j = Math.sin(k * Math.PI * 3) * (1 - k) * 7; jolt[0] += j; jolt[1] -= j * 0.6; }
  });
}

// =============================================================== headlines ==
const TYPE = document.getElementById('type');
function headline(o) {
  const { a, b } = o;
  const box = html('div', 'hl', TYPE);
  Object.assign(box.style, { left: o.x + 'px', top: o.y + 'px', width: (o.w ?? 1100) + 'px', textAlign: o.align ?? 'left' });
  if (o.eyebrow) on(html('div', 'eyebrow', box, o.eyebrow), 'up', a, a + 0.55, { out: [b - 0.45, b - 0.05] });
  const h = html('h1', 'display', box);
  h.style.fontSize = (o.size ?? 108) + 'px';
  o.title.forEach((line, i) => {
    const l = html('span', 'line', h);
    on(l, 'rise', a + 0.12 + i * 0.12, a + 0.95 + i * 0.12, { inner: html('span', '', l, line), out: [b - 0.5 + i * 0.07, b - 0.05 + i * 0.07] });
  });
  every((t) => h.style.setProperty('--u', (P(t, a + 0.95, a + 1.6, E.io) * (1 - P(t, b - 0.55, b - 0.3))).toFixed(3)));
  if (o.sub) {
    const p = html('p', 'sub', box, o.sub);
    p.style.width = (o.subW ?? 640) + 'px';
    if (o.align === 'center') p.style.margin = '30px auto 0';
    on(p, 'up', a + 0.75, a + 1.35, { out: [b - 0.5, b - 0.1] });
  }
  const [dx, dy] = o.drift ?? [-26, 0];
  every((t) => {
    const k = P(t, a, b + 0.3);
    box.style.transform = `translate(${f1(dx * k)}px, ${f1(dy * k)}px)`;
    box.style.visibility = t < a - 0.05 || t > b + 0.6 ? 'hidden' : 'visible';
  });
  return box;
}

// ========================================================= persistent chrome ==
const CHAPTERS = [0, 5.5, 10.6, 15.6, 21.8, 26.4, 30.3];
function activeWorld(t) {
  let w = worlds[0];
  for (const W of worlds) if (t >= W.a && t <= W.b) w = W;
  return w;
}
function buildChrome() {
  const c = document.getElementById('chrome');
  const g = svg('g', {}, c);
  on(g, 'fade', 0.1, 0.9);
  const soft = 'rgba(35,62,101,.5)';
  for (const [x, y, sx, sy] of [[70, 70, -1, -1], [1850, 70, 1, -1], [70, 1010, -1, 1], [1850, 1010, 1, 1]]) {
    svg('path', { d: `M${x + sx * 14} ${y} h${sx * 40} M${x} ${y + sy * 14} v${sy * 40}`, ...ink(1.2, soft) }, g);
  }
  const rg = svg('g', { transform: 'translate(960 42)' }, g);
  svg('circle', { r: 11, ...ink(1.1, soft) }, rg);
  svg('path', { d: 'M-20 0 H20 M0 -20 V20', ...ink(1.1, soft) }, rg);
  // ruler, bottom left: it slides as the camera travels, like a scale rule under the drawing
  const clip = svg('clipPath', { id: 'ruler-clip' }, c);
  svg('rect', { x: 140, y: 990, width: 420, height: 50 }, clip);
  const rw = svg('g', { 'clip-path': 'url(#ruler-clip)' }, g);
  const rl = svg('g', {}, rw);
  const labels = [];
  for (let i = 0; i <= 90; i++) {
    const hgt = i % 10 === 0 ? 14 : i % 5 === 0 ? 9 : 5;
    svg('line', { x1: i * 5, y1: 0, x2: i * 5, y2: -hgt, ...ink(1, 'rgba(35,62,101,.45)') }, rl);
    if (i % 10 === 0) labels.push(svg('text', { x: i * 5, y: 18, 'font-size': 12, 'text-anchor': 'middle', class: 'mono', fill: 'rgba(35,62,101,.55)', text: '' }, rl));
  }
  svg('text', { x: 572, y: 1026, 'font-size': 12, class: 'mono', fill: 'rgba(35,62,101,.55)', text: 'cm' }, g);
  // progress: one small star per chapter
  const pr = svg('g', { transform: 'translate(1590 150)' }, g);
  const stars = [];
  for (let i = 0; i < 7; i++) stars.push(svg('path', { d: starPath(0, 0, 9, 16), transform: `translate(${i * 36} 0)`, ...ink(1.2, GOLD) }, pr));
  // title block, bottom right
  const tb = svg('g', { transform: 'translate(1290 978)' }, g);
  svg('rect', { x: 0, y: 0, width: 560, height: 60, ...ink(1, 'rgba(35,62,101,.45)') }, tb);
  for (const x of [190, 350, 460]) svg('line', { x1: x, y1: 0, x2: x, y2: 60, ...ink(1, 'rgba(35,62,101,.45)') }, tb);
  const cell = (x, k, v) => {
    svg('text', { x: x + 12, y: 22, 'font-size': 11, class: 'mono', fill: 'rgba(35,62,101,.55)', 'letter-spacing': 1.5, text: k }, tb);
    return svg('text', { x: x + 12, y: 45, 'font-size': 15, class: 'mono', fill: NAVY, 'letter-spacing': 1.2, text: v }, tb);
  };
  cell(0, 'PROJE', 'ATLAS PROJE');
  const sheet = cell(190, 'LEVHA', '01 / 07');
  const scale = cell(350, 'ÖLÇEK', '1 : 50');
  cell(460, 'ÇİZEN', 'İÜ·AÜ·MÜ');

  const blotch = document.getElementById('blotch');
  every((t) => {
    let idx = 0;
    CHAPTERS.forEach((s, i) => { if (t >= s) idx = i; });
    sheet.textContent = `0${idx + 1} / 07`;
    stars.forEach((st, i) => {
      const pop = i === idx ? 1 + 0.35 * (1 - P(t, CHAPTERS[i], CHAPTERS[i] + 0.5, E.out)) + 0.3 : 1;
      st.setAttribute('fill', i <= idx ? GOLD : 'none');
      st.setAttribute('transform', `translate(${i * 36} 0) scale(${pop.toFixed(3)}) rotate(${i === idx ? f1(t * 20) : 0})`);
    });
    const W = activeWorld(t), cm = W.c;
    scale.textContent = `1 : ${Math.max(1, Math.round(50 / cm.z))}`;
    const px = cm.x * cm.z * 0.5 + 4000;
    rl.setAttribute('transform', `translate(${f1(150 - (px % 50))} 1022)`);
    const base = Math.floor(px / 50);
    labels.forEach((lb, i) => (lb.textContent = String(base + i)));
    // the paper moves with the drawing (blotches are part of the sheet)
    const kz = clamp(cm.z, 0.6, 2.5);
    blotch.style.backgroundSize = `${f1(900 * kz)}px ${f1(900 * kz)}px`;
    blotch.style.backgroundPosition = `${f1(-cm.x * cm.z + 960)}px ${f1(-cm.y * cm.z + 540)}px`;
  });
}

// Floating graphite dust in front of the drawing: moves faster than the camera, so pans read as depth.
function buildDust() {
  const fx = document.getElementById('fx');
  const motes = [];
  for (let i = 0; i < 26; i++) {
    const m = svg('circle', { r: 1 + rnd(i + 300) * 2.2, fill: i % 5 === 0 ? GOLD : NAVY }, fx);
    motes.push({ m, x: rnd(i + 100) * 2200, y: rnd(i + 200) * 1300, depth: 1.15 + rnd(i + 400) * 0.6, o: 0.12 + rnd(i + 500) * 0.2 });
  }
  every((t) => {
    const cm = activeWorld(t).c;
    for (const p of motes) {
      const x = ((((p.x - cm.x * cm.z * p.depth + t * 9) % 2200) + 2200) % 2200) - 140;
      const y = ((((p.y - cm.y * cm.z * p.depth - t * 14) % 1300) + 1300) % 1300) - 110;
      p.m.setAttribute('cx', f1(x)); p.m.setAttribute('cy', f1(y));
      p.m.setAttribute('opacity', (p.o * P(t, 0.4, 1.4)).toFixed(3));
    }
  });
}

// ============================================================ W1 · intro ==
// The star is constructed with pencil and compass; Atlas runs in and takes it.
const GROUND = 440;
const fData = (x) => 440 - 450 / (1 + Math.exp(-(x - 2600) / 115));
const ground1 = (x) => (x < 1950 ? GROUND : fData(x));
const W1 = world('w1', -1, 16.35, [[0, 0, 0, 1]]);
const atlas1 = figure(W1, { ground: ground1, scale: 1.2, seed: 3 });

function buildIntro() {
  const g = W1.cam, fl = W1.flat;
  const cx = 0, cy = 0, R = 250;
  const pol = (r, d) => [cx + r * Math.cos(rad(d)), cy + r * Math.sin(rad(d))];
  const OUT = [3.5, 4.1];
  // ink drop where the first line starts
  const drop = svg('g', {}, g);
  svg('circle', { cx: -420, cy: 0, r: 7, fill: NAVY }, drop);
  for (let k = 0; k < 6; k++) {
    const a = rnd(k + 40) * 6.28, d = 14 + rnd(k + 50) * 14;
    svg('circle', { cx: -420 + Math.cos(a) * d, cy: Math.sin(a) * d, r: 1.4 + rnd(k + 60) * 2.2, fill: NAVY }, drop);
  }
  on(drop, 'pop', 0.05, 0.35, { ease: E.back, out: OUT });
  on(svg('line', { x1: -420, y1: 0, x2: 420, y2: 0, ...ink(1.4, 'rgba(35,62,101,.55)') }, g), 'draw', 0.25, 1.1, { out: OUT });
  pencil(W1, (t) => [lerp(-420, 420, P(t, 0.25, 1.1, E.io)), 0], -0.1, 0.25, 1.1, 1.55);
  on(svg('line', { x1: cx, y1: cy - 400, x2: cx, y2: cy + 400, ...ink(1, 'rgba(35,62,101,.4)') }, g), 'draw', 0.9, 1.6, { out: OUT });
  on(svg('circle', { cx, cy, r: 362, ...ink(1.2, 'rgba(35,62,101,.3)', { 'stroke-dasharray': '2 9' }) }, g), 'fade', 1.2, 1.9, { out: OUT });
  compass(W1, [cx, cy], 290, 0.8, 1.6, -90, { out: [3.5, 4.0], w: 1.4 });
  for (let i = 0; i < 24; i++) {
    const [x1, y1] = pol(290, i * 15), [x2, y2] = pol(i % 3 ? 300 : 312, i * 15);
    on(svg('line', { x1, y1, x2, y2, ...ink(1, 'rgba(35,62,101,.5)') }, g), 'fade', 1.3 + i * 0.02, 1.6 + i * 0.02, { out: OUT });
  }
  const A = [cx - R, cy], B = [cx + R, cy], cr = R * Math.SQRT2;
  [[A, -58, -32], [B, -148, -122], [A, 32, 58], [B, 122, 148]].forEach(([p, f, to], i) =>
    on(svg('path', { d: arcPath(p[0], p[1], cr, f, to), ...ink(1.4, OX) }, g), 'draw', 1.1 + i * 0.12, 1.6 + i * 0.12, { out: OUT }));
  const sq = (o) => pathOf([0, 1, 2, 3].map((k) => pol(R, o + k * 90)), true);
  on(svg('path', { d: sq(0), ...ink(1.2, 'rgba(35,62,101,.55)') }, g), 'draw', 1.35, 2.1, { out: OUT });
  on(svg('path', { d: sq(45), ...ink(1.2, 'rgba(35,62,101,.55)') }, g), 'draw', 1.5, 2.25, { out: OUT });
  on(svg('path', { d: atlasStar(cx, cy, R), ...ink(2.4) }, g), 'draw', 1.7, 2.6, { out: [3.6, 4.15] });
  // the gold star (hands over to Atlas's companion star at 4.2)
  on(svg('path', { d: atlasStar(cx, cy, 148), fill: GOLD }, g), 'fade', 2.35, 2.8, { out: [4.19, 4.2] });
  on(svg('path', { d: atlasStar(cx, cy, 148), ...ink(2.2) }, g), 'draw', 2.0, 2.7, { out: [4.19, 4.2] });
  on(svg('circle', { cx, cy, r: 42, ...ink(1.6) }, g), 'draw', 2.5, 3.0, { out: OUT });
  on(svg('path', { d: arcPath(cx, cy, 95, 0, 45), ...ink(1.5, OX) }, g), 'draw', 2.6, 3.0, { out: OUT });
  const [px, py] = pol(R, 45);
  on(svg('line', { x1: cx, y1: cy, x2: px, y2: py, ...ink(1.2) }, g), 'draw', 2.6, 3.0, { out: OUT });
  const dy = cy + 345;
  on(svg('path', { d: `M${A[0]} ${cy + 12} V${dy + 14} M${B[0]} ${cy + 12} V${dy + 14}`, ...ink(1, 'rgba(35,62,101,.5)') }, g), 'draw', 2.4, 3.0, { out: OUT });
  on(svg('path', { d: `M${A[0]} ${dy} H${B[0]} M${A[0]} ${dy} l12 -5 M${A[0]} ${dy} l12 5 M${B[0]} ${dy} l-12 -5 M${B[0]} ${dy} l-12 5`, ...ink(1.2) }, g), 'draw', 2.7, 3.2, { out: OUT });
  const lab = svg('g', {}, fl);
  svg('rect', { x: cx - 52, y: dy - 14, width: 104, height: 28, fill: PAPER }, lab);
  svg('text', { x: cx, y: dy + 6, 'text-anchor': 'middle', 'font-size': 17, 'letter-spacing': 1.5, class: 'mono', fill: NAVY, text: 'Ø 500' }, lab);
  svg('text', { x: cx + 108, y: cy - 16, 'font-size': 17, class: 'mono', fill: OX, text: '45°' }, lab);
  svg('text', { x: A[0] - 30, y: cy - 12, 'font-size': 28, class: 'note', fill: NAVY, text: 'A' }, lab);
  svg('text', { x: B[0] + 12, y: cy - 12, 'font-size': 28, class: 'note', fill: NAVY, text: 'B' }, lab);
  svg('text', { x: cx + 14, y: cy - R - 12, 'font-size': 28, class: 'note', fill: NAVY, text: 'C' }, lab);
  on(lab, 'fade', 2.9, 3.3, { out: [3.4, 3.8] });

  // the ground: one line that later becomes the floor slab and the chart's axis
  on(svg('line', { x1: -1500, y1: GROUND, x2: 700, y2: GROUND, ...ink(2.2) }, g), 'draw', 2.2, 3.1);
  for (let k = 0; k < 22; k++) {
    const x = -1480 + k * 100 + rnd(k + 900) * 40;
    on(svg('path', { d: `M${f1(x)} ${GROUND + 8} l-12 12 M${f1(x + 22)} ${GROUND + 8} l-12 12`, ...ink(1.1, 'rgba(35,62,101,.35)') }, g), 'fade', 2.6 + k * 0.02, 3.0 + k * 0.02);
  }

  headline({ ...COPY.intro, title: COPY.intro.title, eyebrow: COPY.intro.eyebrow, x: 150, y: 150, size: 136, a: 1.85, b: 4.4, drift: [-30, 0] });
}

// ============================================================== W1 · MEP ==
// A building section draws itself around Atlas; he opens the valve and the system comes alive.
const VC = [1180, 280]; // valve handwheel
function buildMep() {
  const g = W1.cam, fl = W1.flat;
  const X0 = 700, X1 = 1900, ROOF = -262, SLAB = 90;
  // slab, walls, floor, roof
  on(svg('line', { x1: 700, y1: GROUND, x2: 1950, y2: GROUND, ...ink(2.2) }, g), 'draw', 5.4, 6.6);
  on(svg('line', { x1: 700, y1: GROUND + 22, x2: 1900, y2: GROUND + 22, ...ink(1.6) }, g), 'draw', 5.6, 6.8);
  for (let k = 0; k < 40; k++) on(svg('path', { d: `M${710 + k * 30} ${GROUND + 22} l18 -20`, ...ink(1, 'rgba(35,62,101,.4)') }, g), 'fade', 5.7 + k * 0.025, 6.0 + k * 0.025);
  const wall = (x, a) => {
    on(svg('path', { d: `M${x} 180 V${ROOF} M${x + 18} 180 V${ROOF} M${x} 180 H${x + 18}`, ...ink(2) }, g), 'draw', a, a + 0.7);
    for (let y = ROOF + 20; y < 170; y += 26) on(svg('path', { d: `M${x + 2} ${y + 14} l14 -14`, ...ink(1, 'rgba(35,62,101,.4)') }, g), 'fade', a + 0.4, a + 0.8);
  };
  wall(X0, 5.7);
  wall(X1 - 18, 6.5);
  on(svg('path', { d: `M${X0 + 18} ${SLAB} H${X1 - 18} M${X0 + 18} ${SLAB + 18} H${X1 - 18}`, ...ink(2) }, g), 'draw', 6.0, 6.9);
  on(svg('path', { d: `M${X0 - 12} ${ROOF} H${X1 + 12} M${X0 - 12} ${ROOF + 18} H${X1 + 12} M${X0 - 12} ${ROOF} v-30 M${X1 + 12} ${ROOF} v-30`, ...ink(2) }, g), 'draw', 6.2, 7.1);
  for (let k = 0; k < 38; k++) {
    const x = X0 + 30 + k * 30;
    on(svg('path', { d: `M${x} ${SLAB + 16} l14 -14`, ...ink(1, 'rgba(35,62,101,.35)') }, g), 'fade', 6.5 + k * 0.01, 6.8 + k * 0.01);
  }

  // pipes: centre lines, with flow dashes once the valve opens
  const PR = 7;
  const runs = [
    { pts: [[790, 376], [790, 150], [1760, 150]], a: 6.3, b: 7.3, flow: 8.55 },
    { pts: [[1180, 150], [1180, 330], [1228, 330], [1228, 344]], a: 6.8, b: 7.3, flow: 8.5 },
    { pts: [[1760, 150], [1760, -150], [1500, -150]], a: 7.0, b: 7.6, flow: 8.85 },
    { pts: [[1760, -150], [1760, -200], [2016, -200]], a: 7.2, b: 7.7, flow: 9.1 },
  ];
  for (const r of runs) {
    const [w1, w2] = pipeWalls(r.pts, PR);
    on(svg('path', { d: w1, ...ink(2.2) }, g), 'draw', r.a, r.b);
    on(svg('path', { d: w2, ...ink(2.2) }, g), 'draw', r.a + 0.06, r.b + 0.06);
    const fl2 = svg('path', { d: pathOf(r.pts), ...ink(2, GOLD, { 'stroke-dasharray': '5 15' }) }, g);
    on(fl2, 'fade', r.flow, r.flow + 0.3);
    every((t) => { if (t > r.flow - 0.1 && t < 16.4) fl2.style.strokeDashoffset = -(t - r.flow) * 90; });
  }
  // outlet flange
  on(svg('path', { d: 'M2016 -212 V-188 M2024 -214 V-186', ...ink(2.4) }, g), 'draw', 7.6, 7.8);

  // pump with a spinning impeller
  const pump = svg('g', {}, g);
  svg('rect', { x: 752, y: 430, width: 76, height: 10, ...ink(2), fill: PAPER }, pump);
  svg('circle', { cx: 790, cy: 402, r: 30, ...ink(2.4), fill: PAPER }, pump);
  on(pump, 'pop', 6.0, 6.45, { ease: E.back });
  const imp = svg('path', { d: 'M-14 -12 L18 0 L-14 12 Z', ...ink(2.2) }, g);
  on(imp, 'fade', 6.2, 6.5);
  every((t) => imp.setAttribute('transform', `translate(790 402) rotate(${f1(Math.max(0, t - 8.5) * 540)})`));

  // valve handwheel on the drop (turns when Atlas turns it)
  const wheel = svg('g', {}, g);
  svg('circle', { r: 24, ...ink(3, OX), fill: 'none' }, wheel);
  svg('path', { d: 'M-24 0 H24 M0 -24 V24', ...ink(2.2, OX) }, wheel);
  svg('circle', { r: 5, fill: OX }, wheel);
  const wheelIn = svg('g', {}, g);
  wheelIn.appendChild(wheel);
  on(wheelIn, 'pop', 6.9, 7.3, { ease: E.back });
  const wheelAngle = (t) => -90 + 450 * P(t, 7.85, 8.75, E.io);
  every((t) => wheel.setAttribute('transform', `translate(${VC[0]} ${VC[1]}) rotate(${f1(wheelAngle(t) + 90)})`));

  // wash basin + water from the tap
  const basin = svg('g', {}, g);
  svg('path', { d: 'M1192 372 H1272 Q1270 402 1232 404 Q1194 402 1192 372 Z', ...ink(2.2), fill: PAPER }, basin);
  svg('path', { d: 'M1226 404 V440 M1238 404 V440', ...ink(2) }, basin);
  on(basin, 'pop', 7.0, 7.4, { ease: E.back });
  const stream = svg('path', { d: 'M1228 348 C1229 356 1231 366 1232 374', ...ink(4, GOLD, { 'stroke-dasharray': '7 6' }) }, g);
  on(stream, 'fade', 8.5, 8.65);
  every((t) => (stream.style.strokeDashoffset = -t * 70));
  for (let k = 0; k < 3; k++) {
    const rip = svg('ellipse', { cx: 1232, cy: 378, rx: 1, ry: 1, ...ink(1.4, GOLD) }, g);
    every((t) => {
      const ph = ((t - 8.55 - k * 0.22) % 0.66) / 0.66;
      const on_ = t > 8.55 + k * 0.22;
      rip.setAttribute('rx', f1(6 + ph * 26)); rip.setAttribute('ry', f1(2 + ph * 5));
      rip.setAttribute('opacity', on_ ? f1((1 - ph) * 0.9) : 0);
    });
  }

  // sprinkler heads on the main
  for (const x of [960, 1420]) {
    const sp = svg('g', {}, g);
    svg('path', { d: `M${x} 158 V176 M${x - 11} 178 H${x + 11}`, ...ink(2.2, OX) }, sp);
    svg('circle', { cx: x, cy: 170, r: 4, fill: OX }, sp);
    on(sp, 'pop', 7.1, 7.4, { ease: E.back });
  }
  // fan-coil unit upstairs, fan spins, air waves out
  on(svg('path', { d: 'M1300 -205 H1500 V-105 H1300 Z', ...ink(2.2), fill: PAPER }, g), 'draw', 7.0, 7.6);
  for (let k = 0; k < 4; k++) on(svg('path', { d: `M1310 ${-190 + k * 22} H1340`, ...ink(1.2, 'rgba(35,62,101,.55)') }, g), 'fade', 7.4, 7.7);
  on(svg('circle', { cx: 1420, cy: -155, r: 34, ...ink(2) }, g), 'draw', 7.2, 7.7);
  const fan = svg('g', {}, g);
  for (let k = 0; k < 3; k++) svg('path', { d: 'M0 0 C 8 -10, 22 -12, 28 -4 C 18 0, 8 2, 0 0 Z', fill: NAVY, transform: `rotate(${k * 120})` }, fan);
  on(fan, 'fade', 7.4, 7.7);
  every((t) => fan.setAttribute('transform', `translate(1420 -155) rotate(${f1(t * 30 + Math.max(0, t - 8.9) * 900)})`));
  for (let k = 0; k < 3; k++) {
    const air = svg('path', { d: `M1290 ${-180 + k * 26} q-20 -8 -40 0 t-40 0 t-40 0`, ...ink(1.8, 'rgba(35,62,101,.6)', { 'stroke-dasharray': '14 10' }) }, g);
    on(air, 'fade', 9.0 + k * 0.08, 9.3 + k * 0.08);
    every((t) => (air.style.strokeDashoffset = t * 60));
  }

  // labels (crisp)
  const labels = svg('g', {}, fl);
  svg('path', { d: 'M1560 150 L1600 70 H1700', ...ink(1.2) }, labels);
  svg('text', { x: 1606, y: 62, 'font-size': 20, class: 'mono', fill: NAVY, text: 'DN 50' }, labels);
  svg('text', { x: 900, y: 134, 'font-size': 18, class: 'mono', fill: GOLD, text: 'Q = 2,4 L/s →' }, labels);
  svg('path', { d: 'M1790 -160 l-10 -14 h20 Z M1780 -174 h80', ...ink(1.4) }, labels);
  svg('text', { x: 1796, y: -182, 'font-size': 18, class: 'mono', fill: NAVY, text: '+3.20' }, labels);
  svg('text', { x: 734, y: 350, 'font-size': 16, class: 'mono', fill: 'rgba(35,62,101,.7)', 'letter-spacing': 2, text: 'P-01' }, labels);

    const ring = svg('circle', { cx: x1, cy: y1, r: 6, ...ink(1.6, GOLD) }, g);
    every((t) => {

        drop.style.display = '';
        const u = (t - t0) / (t1 - t0);
        const x = lerp(SPOUT[0], x1, u), y = SPOUT[1] + (y1 - SPOUT[1]) * u * u - 50 * Math.sin(Math.PI * u) * (1 - u);
        const vx = x1 - SPOUT[0], vy = 2 * (y1 - SPOUT[1]) * u - 50 * Math.PI * Math.cos(Math.PI * u) * (1 - u) + 50 * Math.sin(Math.PI * u);
        drop.setAttribute('transform', `translate(${f1(x)} ${f1(y)}) rotate(${f1(deg(Math.atan2(vy, vx)))})`);
      }
      const k = clamp((t - t1) / 0.4);
      ring.setAttribute('r', f1(6 + k * 22));
      ring.setAttribute('opacity', t < t1 || k >= 1 ? 0 : f1(1 - k));
    });
  }

  const fit = [];

  const trend = svg('path', { d: pathOf(fit), ...ink(3.4, OX), pathLength: 1, 'stroke-dasharray': '1 1' }, g);

  on(eq, 'fade', 12.2, 12.7);
  // forecast: dashed continuation and a hatched cone of uncertainty
  const fc = [], up = [], lo = [];
  for (let x = 2940; x <= 3210; x += 10) {
    const w = (x - 2940) * 0.5;

  }

  for (let k = 0; k <= 60; k++) {

  headline({ ...COPY.data, x: 150, y: 150, size: 100, a: 12.2, b: 15.0, subW: 560 });
}

// ============================================================== render ==
const turb = [...document.querySelectorAll('feTurbulence')];
const grain = document.getElementById('grain');
const worldsEl = document.getElementById('worlds');

function render(t) {
  // pencil boil: new noise 8× a second
  const step = Math.floor(t * 8);
  turb.forEach((f, i) => f.setAttribute('seed', String(((step * 7 + i * 13) % 97) + 1)));
  grain.style.backgroundPosition = `${(step * 53) % 220}px ${(step * 97) % 220}px`;
  jolt = [0, 0];

  for (const W of worlds) {
    const vis = t >= W.a && t <= W.b;
    W.div.style.display = vis ? '' : 'none';
    W.c = camAt(W, t);
    if (!vis) continue;
    const c = W.c;
    const tr = `translate(960 540) rotate(${c.r.toFixed(3)}) scale(${c.z.toFixed(5)}) translate(${(-c.x).toFixed(2)} ${(-c.y).toFixed(2)})`;
    W.cam.setAttribute('transform', tr);
    W.flat.setAttribute('transform', tr);
  }
  // push into the answer bubble, then the training world grows out of the paper
  W3.div.style.opacity = P(t, 21.72, 21.9).toFixed(3);

  for (const it of items) {
    const { el, kind } = it;
    if (kind === 'fn') { it.fn(t); continue; }
    const inp = P(t, it.a, it.b, it.ease || (kind === 'draw' || kind === 'drawText' ? E.io : E.out));
    const outp = P(t, it.c, it.d, E.io);
    switch (kind) {
      case 'draw':
        el.style.strokeDashoffset = outp > 0 ? -outp : 1 - inp;
        el.style.visibility = inp <= 0.001 || outp >= 0.999 ? 'hidden' : 'visible';
        break;
      case 'drawText':
        el.style.strokeDashoffset = outp > 0 ? -it.len * outp : it.len * (1 - inp);
        el.style.visibility = inp <= 0.001 || outp >= 0.999 ? 'hidden' : 'visible';
        break;
      case 'fade':
        el.style.opacity = inp * (1 - outp) * (it.max ?? 1);
        break;
      case 'up':
        el.style.opacity = inp * (1 - outp);
        el.style.transform = `translateY(${f1((1 - inp) * 22 - outp * 14)}px)`;
        break;
      case 'rise':
        it.inner.style.transform = `translateY(${f1((1 - inp) * 115)}%) rotate(${f1((1 - inp) * 3)}deg)`;
        el.style.opacity = 1 - outp;
        el.style.transform = `translateY(${f1(-outp * 30)}px)`;
        break;
      case 'pop':
        el.style.transform = `scale(${Math.max(0, inp).toFixed(4)})`;
        el.style.opacity = (inp > 0 ? 1 : 0) * (1 - outp);
        break;
      case 'stamp': {
        const k = clamp((t - it.a) / (it.b - it.a));
        const sc = 1 + (1 - E.inQ(k)) * 1.6;
        el.style.transform = `scale(${sc}) rotate(${(1 - k) * 10}deg)`;
        el.style.opacity = (t < it.a ? 0 : Math.min(1, k * 2.5) * 0.9) * (1 - outp);
        break;
      }
    }
  }
  worldsEl.style.transform = jolt[0] || jolt[1] ? `translate(${f1(jolt[0])}px, ${f1(jolt[1])}px)` : '';
}

buildDust();
buildChrome();

const stage = document.getElementById('stage');
let recording = false;
let playing = true;
let clock = 0;
let last = null;

function fit() {
  if (recording) { stage.style.transform = ''; return; }
  const k = Math.min(innerWidth / 1920, innerHeight / 1080);
  stage.style.transform = `translate(${(innerWidth - 1920 * k) / 2}px, ${(innerHeight - 1080 * k) / 2}px) scale(${k})`;
}
addEventListener('resize', fit);
fit();

function loop(now) {
  if (recording) return;
  if (last != null && playing) clock = (clock + (now - last) / 1000) % (DURATION + 1);
  last = now;
  render(Math.min(clock, DURATION));
  requestAnimationFrame(loop);
}
addEventListener('keydown', (e) => {
  if (e.code === 'Space') playing = !playing;
  if (e.code === 'ArrowRight') clock = Math.min(DURATION, clock + 1);
  if (e.code === 'ArrowLeft') clock = Math.max(0, clock - 1);
  if (e.key === '0') clock = 0;
});

const ready = Promise.all([
  document.fonts.load("380 128px 'Fraunces'"),
  document.fonts.load("italic 340 128px 'Fraunces'"),
  document.fonts.load("400 32px 'Instrument Sans'"),
  document.fonts.load("500 20px 'IBM Plex Mono'"),
  document.fonts.load("400 20px 'IBM Plex Mono'"),
  new Promise((r) => (document.querySelector('img').complete ? r() : document.querySelector('img').addEventListener('load', r, { once: true }))),
]).then(() => document.fonts.ready).then(() => true);

window.__film = {
  duration: DURATION,
  ready,
  record() { recording = true; fit(); },
  render,
};
ready.then(() => requestAnimationFrame(loop));
</script>
</body>
</html>
